# Coconut with Trajectory Consistency - Evaluation Config
# Usage: torchrun --nnodes 1 --nproc_per_node 8 run.py args/gsm_coconut_trajectory_eval.yaml

project: coconut
save_path: ./ckpts
name: gsm_coconut_trajectory

only_eval: True

coconut: True
cot: False
no_thoughts: False
no_cot: False
coconutgpt: True

c_thought: 2
epochs_per_stage: 3
max_latent_stage: 5
pad_latent_to_max: True

save_only_improve: False
uniform_prob: 0.0

# Model paths
model_id: ./pretrained/gpt2
# Load the trained checkpoint with trajectory consistency
load_model_path: ./ckpts/gsm_coconut_trajectory/checkpoint_25

wandb: False
seed: 0
resume: 0
bf16: False

# Dataset paths
train_path: ./data/gsm_train.json
val_path: ./data/gsm_test.json

reset_optimizer: True
batch_size_training: 8
debug: False
gradient_accumulation_steps: 2
num_epochs: 25
lr: !!float "1e-4"
weight_decay: 0.01

w_prompt: False
mode: coconutgpt_same_word_embedding
explain_mode: v1_aug

# Training method
training_method: full
train_or_eval: eval

# Trajectory Consistency Settings (needed for model initialization)
use_trajectory_consistency: True
trajectory_radius_threshold: 2.0
trajectory_loss_factor: 0.1
