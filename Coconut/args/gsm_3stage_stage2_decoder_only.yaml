# Stage 2: Decoder-only Training
# 在此阶段，只训练 decoder。由于 LLM 被冻结，模型性能保持不变

project: coconut
save_path: ./ckpts
name: gsm_3stage_stage2_decoder_only

only_eval: False

coconut: True
cot: False
no_thoughts: False
no_cot: False
coconutgpt: True

# 与 Stage 1 保持一致
# Stage 2 只训练 decoder，LLM 已完成训练，使用全 latent 模式
c_thought: 6
epochs_per_stage: 1
max_latent_stage: 1
pad_latent_to_max: True
progressive_train: True

save_only_improve: False
uniform_prob: 0.0

# Model and checkpoint paths
model_id: ./pretrained/gpt2
# 从 Stage 1 的 checkpoint 加载
load_model_path: ./ckpts/gsm_3stage_stage1_llm_only/checkpoint_3

wandb: True
seed: 0
resume: 6              # stage=6 > max_latent_stage=5，确保全 latent 模式
bf16: True

# 数据路径
train_path: ./data/gsm_train.json
val_path: ./data/gsm_test.json

reset_optimizer: True
batch_size_training: 32
debug: False
gradient_accumulation_steps: 1

# Stage 2: 训练 decoder（从 epoch 6 开始）
num_epochs: 10
lr: !!float "1e-4"
weight_decay: 0.01

# Stage 2: 使用带 decoder 的模式
mode: coconutgpt_same_word_embedding

# 关键：只训练 decoder，冻结 LLM
training_method: only_expainable_llm

# Explainable 设置
w_prompt: False
explain_mode: v1_aug

# 评估设置
train_or_eval: train
