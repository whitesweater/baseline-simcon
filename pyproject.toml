[project]
name = "baseline"
version = "0.1.0"
description = "SIM-CoT baseline implementation"
requires-python = ">=3.10,<3.13"
dependencies = [
    # 核心依赖（基于 CODI 实测版本，放宽上界）
    "torch>=2.5.1", # CODI: 2.7.1
    "transformers @ git+https://github.com/huggingface/transformers.git", # Qwen3.5 needs mainline support for qwen3_5
    "accelerate>=1.7.0", # CODI: 1.7.0
    "peft>=0.13.0", # CODI: 0.15.2
    "datasets>=3.1.0", # CODI: 3.6.0
    # 数值/数据处理
    "numpy>=1.24.0", # CODI: 2.2.6
    "pandas>=2.2.0", # CODI: 2.2.3
    "pyarrow>=14.0.0", # CODI: 20.0.0
    "tqdm>=4.66.0", # CODI: 4.67.1
    # HuggingFace 生态
    "huggingface-hub>=0.20.0", # CODI: 0.32.4
    "tokenizers>=0.20.0", # CODI: 0.21.1
    "safetensors>=0.4.0", # CODI: 0.5.3
    # 训练监控
    "tensorboardx>=2.6.0", # CODI: 2.6.2.2
    # 工具库
    "pyyaml>=6.0", # CODI: 6.0.2
    "protobuf>=3.20.0", # CODI: 6.31.1
    "psutil>=5.9.0", # CODI: 7.0.0
    "regex>=2024.0.0", # CODI: 2024.11.6
    "requests>=2.31.0", # CODI: 2.32.3
    "jinja2>=3.1.0", # CODI: 3.1.6
    "tensorboard",
    "tabulate>=0.9.0",
    "matplotlib>=3.10.8",
    "seaborn>=0.13.2",
    "wandb>=0.24.0",
    "modelscope>=1.33.0",
    "umap-learn>=0.5.3",
    "llvmlite>=0.40.0",
]

[project.optional-dependencies]
# 开发依赖
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]

# ModelScope 支持（可选）
modelscope = [
    "modelscope>=1.10.0",
]

[tool.setuptools]
# This repo uses pyproject.toml primarily as a dependency manifest for the
# workspace, not as a single-package distribution. Disable automatic package
# discovery so editable installs do not fail on the flat multi-project layout.
py-modules = []

[tool.uv]
python-preference = "only-managed"

# PyPI 镜像源配置
[[tool.uv.index]]
url = "https://mirrors.cloud.tencent.com/pypi/simple/"

[[tool.uv.index]]
url = "https://pypi.org/simple/"

[[tool.uv.index]]
url = "http://harbor.internal.com:8081/repository/pypi-hkust/simple/"

